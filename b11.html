const form=document.getElementById('login');
form.addEventListener('submit',async e=>{
 e.preventDefault();
 const button=document.getElementById('submit');const error=document.getElementById('error');
 button.disabled=true;button.textContent='Açılıyor…';error.textContent='';
 try{
  const pass=document.getElementById('password').value;
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:fromBase64(SALT),iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const zipped=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromBase64(NONCE)},key,fromBase64(ENCRYPTED));
  const decompressed=new Blob([zipped]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(decompressed).text();
  document.open();document.write(html);document.close();
 }catch(err){error.textContent='Şifre yanlış veya sayfa açılamadı. Lütfen tekrar dene.';button.disabled=false;button.textContent='B1.1 Sayfasını Aç';}
