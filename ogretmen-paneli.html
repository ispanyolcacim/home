  const form = document.getElementById('login');
  const input = document.getElementById('password');
  const enter = document.getElementById('enter');
  const message = document.getElementById('message');
  const show = document.getElementById('show');
  const bytes = value => Uint8Array.from(atob(value), character => character.charCodeAt(0));
  show.addEventListener('click', () => { const visible = input.type === 'password'; input.type = visible ? 'text' : 'password'; show.textContent = visible ? 'Gizle' : 'Göster'; show.setAttribute('aria-label', visible ? 'Şifreyi gizle' : 'Şifreyi göster'); show.setAttribute('aria-pressed', String(visible)); });
  form.addEventListener('submit', async event => {
    event.preventDefault(); if (enter.disabled) return;
    message.hidden = true;
    if (!input.value) { message.textContent = 'Lütfen öğretmen şifreni gir.'; message.hidden = false; input.focus(); return; }
    if (!globalThis.crypto?.subtle || !globalThis.isSecureContext) { message.textContent = 'Lütfen paneli güncel bir tarayıcıda HTTPS bağlantısıyla aç.'; message.hidden = false; return; }
    enter.disabled = true; enter.textContent = 'Panel açılıyor…';
    let material;
    try {
      const encoded = new TextEncoder().encode(input.value); input.value = '';
      material = await crypto.subtle.importKey('raw', encoded, 'PBKDF2', false, ['deriveKey']); encoded.fill(0);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(payload.salt), iterations: payload.iterations, hash: 'SHA-256' }, material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);

      const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(payload.iv), additionalData: new TextEncoder().encode(payload.aad), tagLength: 128 }, key, bytes(payload.ciphertext));
      const html = new TextDecoder('utf-8', { fatal: true }).decode(decrypted);
      new Uint8Array(decrypted).fill(0);
      document.open(); document.write(html); document.close();
    } catch {
      material = null; message.textContent = 'Şifre yanlış veya şifreli dosya açılamadı. Lütfen tekrar dene.'; message.hidden = false;
      enter.disabled = false; enter.textContent = 'Paneli aç →'; input.type = 'password'; show.textContent = 'Göster'; show.setAttribute('aria-pressed', 'false'); show.setAttribute('aria-label', 'Şifreyi göster'); input.focus();
    }
  });
  addEventListener('pagehide', () => { input.value = ''; });
